<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awara prototype</title>
<meta name="description" content="Awara rebrand: design system, components, screens and clickable prototype for a live, bendable travel itinerary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap">
<style>
/* =====================================================================
   PROTOTYPE PLAYER — a presentation stage for one product, like a
   prototype shared from a design tool: the phone, its flows, nothing else.
   Each app sets --pl-* on :root in its own CSS.
   ===================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { overflow: hidden; background: var(--pl-bg); color: var(--pl-ink); font-family: var(--pl-font); -webkit-font-smoothing: antialiased; }
.pl button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.pl :focus-visible { outline: 2px solid var(--pl-accent); outline-offset: 3px; }
.pl {
  height: 100vh; height: 100dvh;
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
}
.pl-rail { display: flex; flex-direction: column; gap: 28px; padding: 44px 36px 32px 44px; overflow-y: auto; scrollbar-width: none; }
.pl-brand { display: flex; align-items: center; gap: 10px; }
.pl-tag { font-size: 15px; line-height: 1.55; color: var(--pl-muted); max-width: 30ch; }
.pl-h { font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pl-muted); margin-bottom: 10px; }
.pl-flows ol { list-style: none; display: grid; gap: 2px; counter-reset: flow; }
.pl-flows button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; align-items: baseline;
  padding: 10px 12px; border-radius: 14px; transition: background .2s;
}
.pl-flows button::before { counter-increment: flow; content: counter(flow, decimal-leading-zero); grid-row: span 2; font-size: 12px; font-weight: 600; color: var(--pl-muted); font-variant-numeric: tabular-nums; }
.pl-flows button b { font-size: 15px; font-weight: 600; }
.pl-flows button span { grid-column: 2; font-size: 13px; line-height: 1.45; color: var(--pl-muted); }
.pl-flows button:hover { background: var(--pl-hover); }
.pl-flows button[aria-current="true"] { background: var(--pl-chip); }
.pl-flows button[aria-current="true"]::before { color: var(--pl-accent); }
.pl-foot { margin-top: auto; display: grid; gap: 12px; }
.pl-restart { display: inline-flex; align-items: center; gap: 8px; justify-self: start; height: 40px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--pl-line); font-size: 14px; font-weight: 600; }
.pl-restart:hover { background: var(--pl-hover); }
.pl-restart svg { width: 16px; height: 16px; }
.pl-hint { font-size: 12.5px; line-height: 1.5; color: var(--pl-muted); }
.pl-hint kbd { font: inherit; font-weight: 600; color: var(--pl-ink); }
.pl-deck { position: relative; display: grid; place-items: center; overflow: hidden; }
.pl-device {
  flex: none; width: 414px; height: 868px; padding: 12px; border-radius: 60px; background: #0B0B0B;
  box-shadow: 0 0 0 1.5px var(--pl-bezel-line), 0 50px 90px -34px var(--pl-shadow);
  position: absolute; left: 50%; top: 50%; transform-origin: center;
}
.pl-screen { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; isolation: isolate; }
.pl-chips { display: none; }

/* hotspot hint, same behaviour as a design-tool prototype */
.fg-hint :is(button, [data-act], [role="button"], [role="switch"], [role="tab"]):not([disabled]) {
  outline: 2px solid rgba(13, 153, 255, .75) !important; outline-offset: -1px;
  background-color: rgba(13, 153, 255, .14) !important;
}

/* narrow: the phone leads, flows become a chip row under it */
@media (max-width: 860px) {
  .pl { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
  .pl-rail { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 18px; gap: 12px; }
  .pl-tag, .pl-flows, .pl-hint { display: none; }
  .pl-foot { margin: 0; }
  .pl-chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 16px; scrollbar-width: none; }
  .pl-chips button { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--pl-line); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pl-chips button[aria-current="true"] { background: var(--pl-chip); box-shadow: none; }
}
/* embedded in the portfolio: phone only */
.pl.embed { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.pl.embed .pl-rail, .pl.embed .pl-chips { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* =====================================================================
   AWARA 2.0 — "Wander with a plan that bends"
   Tokens: primitive -> semantic. Components read semantic tokens only.
   ===================================================================== */
:root {
  /* primitives */
  --forest-950: #0C2119; --forest-900: #133326; --forest-800: #1B4735; --forest-600: #2E6B52; --forest-400: #6E9E86; --forest-200: #BCD6C8; --forest-100: #E0ECE4;
  --sun-700: #7A5504; --sun-600: #E3A521; --sun-500: #F4B73A; --sun-300: #F9D27E; --sun-100: #FDF1CF;
  --clay-700: #93351E; --clay-500: #CF5A3A; --clay-100: #F8E0D6;
  --sand-50: #FCFAF5; --sand-100: #F5EFE3; --sand-200: #E9E0CE; --sand-300: #D3C5A9;
  --sky-600: #3A70A3; --sky-100: #DDEAF5;
  --stone-600: #4A5750; --stone-400: #616C65;
  --white: #FFFFFF;
  --veil: rgba(12, 33, 25, .5);
  --on-brand-line: rgba(252, 250, 245, .14);

  /* semantic */
  --a-bg: var(--sand-50); --a-surface: var(--white); --a-sunken: var(--sand-100); --a-line: var(--sand-200); --a-line-2: var(--sand-300);
  --a-ink: var(--forest-950); --a-ink-2: var(--stone-600); --a-ink-3: var(--stone-400);
  --a-brand: var(--forest-900); --a-brand-2: var(--forest-800); --a-on-brand: var(--sand-50); --a-on-brand-2: var(--forest-200);
  --a-action: var(--sun-500); --a-action-press: var(--sun-600); --a-on-action: var(--forest-950); --a-action-soft: var(--sun-100);
  --a-live: var(--clay-500); --a-live-ink: var(--clay-700); --a-live-soft: var(--clay-100);
  --a-calm: var(--forest-100); --a-calm-ink: var(--forest-800);
  --a-sky: var(--sky-600); --a-sky-soft: var(--sky-100);

  /* shape, space, type, elevation */
  --r-pill: 999px; --r-sm: 12px; --r-md: 20px; --r-lg: 32px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --f-display: 'Bricolage Grotesque', 'Arial Narrow', sans-serif;
  --f-body: 'Instrument Sans', system-ui, sans-serif;
  --e-1: 0 1px 2px rgba(12, 33, 25, .05), 0 0 0 1px var(--sand-200);
  --e-2: 0 18px 40px -16px rgba(12, 33, 25, .35);
  --e-3: 0 -16px 48px -8px rgba(12, 33, 25, .3);
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* documentation skin */
  --doc-bg: var(--sand-50); --doc-ink: var(--forest-950); --doc-ink-2: var(--stone-600); --doc-line: var(--sand-200);
  --doc-accent: var(--clay-700); --doc-accent-soft: var(--sun-100); --doc-sunken: var(--sand-100);
  --doc-body: var(--f-body); --doc-h2: 800 60px/.95 var(--f-display); --doc-h4: 700 20px/1.2 var(--f-display);
  --doc-r: var(--r-md); --doc-r-sm: var(--r-sm); --doc-good: var(--forest-600); --doc-bad: var(--clay-700);
}
.doc-h h2 { font-stretch: 75%; letter-spacing: -.01em; }

/* prototype stage */
:root { --pl-bg: var(--sand-200); --pl-ink: var(--forest-950); --pl-muted: var(--stone-600); --pl-line: var(--sand-300);
  --pl-hover: rgba(12, 33, 25, .05); --pl-chip: var(--sand-50); --pl-accent: var(--clay-700);
  --pl-bezel-line: rgba(12, 33, 25, .1); --pl-shadow: rgba(12, 33, 25, .45); --pl-font: var(--f-body); }
.pl-brand .a-mark { width: 38px; height: 38px; }
.pl-brand .a-word { font-size: 30px; }

/* ---------------- screen ---------------- */
.a, .a-kit { font: 400 15px/1.45 var(--f-body); color: var(--a-ink); -webkit-font-smoothing: antialiased; text-align: left; }
.a { width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: var(--a-bg); overflow: hidden; }
.a.dark { background: var(--a-brand); color: var(--a-on-brand); }
.a.long { height: auto; }
.a.long .a-scroll { overflow: visible; flex: none; }
:is(.a, .a-kit) button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
:is(.a, .a-kit) button:disabled { cursor: default; }
.a :focus-visible { outline: 2px solid var(--a-sky); outline-offset: 2px; }
:is(.a, .a-kit) .ic { width: 20px; height: 20px; flex: none; }
.a-status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 30px 0 36px; font-weight: 600; font-size: 16px; }
.a-status .gl { display: flex; gap: 6px; align-items: center; }
.a-status svg { fill: currentColor; }
.a-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s-5) var(--s-8); scrollbar-width: none; position: relative; }
.a-scroll::-webkit-scrollbar { display: none; }
.disp { font-family: var(--f-display); font-stretch: 75%; font-weight: 800; letter-spacing: -.01em; line-height: .95; }
.over { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--a-ink-3); }

/* brand */
.a-mark { width: 34px; height: 34px; color: currentColor; }
.a-mark .route { stroke: var(--a-action); }
.a-mark .sun { fill: var(--a-action); }
.a-word { font: 800 26px/1 var(--f-display); font-stretch: 75%; letter-spacing: -.01em; }
.a-lock { display: inline-flex; align-items: center; gap: 8px; }

/* buttons */
.a-btn { height: 56px; width: 100%; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-size: 16.5px; font-weight: 600; padding: 0 22px; white-space: nowrap; }
.a-btn.primary { background: var(--a-action); color: var(--a-on-action); }
.a-btn.primary:hover, .a-btn.primary.pressed { background: var(--a-action-press); }
.a-btn.secondary { background: var(--a-surface); color: var(--a-ink); box-shadow: inset 0 0 0 1.5px var(--a-line-2); }
.a-btn.secondary:hover, .a-btn.secondary.pressed { box-shadow: inset 0 0 0 1.5px var(--a-ink); }
.a-btn.brand { background: var(--a-brand); color: var(--a-on-brand); }
.a-btn.brand:hover, .a-btn.brand.pressed { background: var(--a-brand-2); }
.a-btn.ghost { height: 46px; color: var(--a-ink-2); }
.a-btn.ghost:hover, .a-btn.ghost.pressed { background: var(--a-sunken); color: var(--a-ink); }
.a.dark .a-btn.ghost, .a-dark .a-btn.ghost, .a-nudge .a-btn.ghost { color: var(--a-on-brand-2); }
.a.dark .a-btn.ghost:hover, .a-dark .a-btn.ghost:hover, .a-nudge .a-btn.ghost:hover { background: var(--on-brand-line); color: var(--a-on-brand); }
.a-btn:disabled { opacity: .4; }
.a-btn.sm { height: 40px; font-size: 14.5px; padding: 0 16px; width: auto; }
.a-btn .ic { width: 19px; height: 19px; }
.a-icbtn { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; flex: none; }
.a-icbtn:hover { background: var(--a-sunken); }
.a-icbtn.boxed { box-shadow: inset 0 0 0 1.5px var(--a-line); background: var(--a-surface); }
.a-icbtn .ic { width: 21px; height: 21px; }

/* chips, tags, pills */
.a-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.a-chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: var(--r-pill); background: var(--a-surface); box-shadow: inset 0 0 0 1.5px var(--a-line); font-size: 14.5px; font-weight: 500; }
.a-chip:hover { box-shadow: inset 0 0 0 1.5px var(--a-line-2); }
.a-chip.on { background: var(--a-brand); color: var(--a-on-brand); box-shadow: none; }
.a-chip .ic { width: 16px; height: 16px; }
.a-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: var(--a-sunken); color: var(--a-ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.a-tag.calm { background: var(--a-calm); color: var(--a-calm-ink); font-weight: 600; }
.a-live { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: var(--r-pill); background: var(--a-live); color: var(--white); font-size: 12.5px; font-weight: 600; letter-spacing: .02em; }
.a-live i { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--white); }
.a-live.soft { background: var(--a-live-soft); color: var(--a-live-ink); }
.a-live.soft i { background: var(--a-live); }
.a-wx { display: flex; align-items: center; gap: 10px; padding: 12px 8px 12px 14px; border-radius: var(--r-sm); background: var(--a-sky-soft); color: var(--a-sky); font-size: 14px; font-weight: 500; }
.a-wx span { flex: 1; color: var(--a-ink); }
.a-wx span b { font-weight: 600; }
.a-wx .a-icbtn { width: 32px; height: 32px; }
.a-wx .a-icbtn .ic { width: 16px; height: 16px; }

/* cards */
.a-card { background: var(--a-surface); border-radius: var(--r-md); box-shadow: var(--e-1); }
.a-sec { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 2px 12px; }
.a-sec h2 { font: 800 24px/1 var(--f-display); font-stretch: 75%; }
.a-sec small { font-size: 13.5px; color: var(--a-ink-3); }

/* nav bar */
.a-tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 8px 12px 28px; background: var(--a-surface); border-top: 1px solid var(--a-line); }
.a-tabs button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--a-ink-3); text-align: center; }
.a-tabs .ic { width: 23px; height: 23px; }
.a-tabs .on { color: var(--a-ink); }
.a-tabs .on .ic { color: var(--forest-600); }
.a-tabs .make span { width: 52px; height: 52px; border-radius: var(--r-pill); background: var(--a-action); color: var(--a-on-action); display: grid; place-items: center; }
.a-tabs .make .ic { width: 24px; height: 24px; color: var(--a-on-action); }

/* nav header */
.a-nav { display: flex; align-items: center; gap: 8px; height: 56px; flex: none; padding: 0 12px; }
.a-nav .t { flex: 1; font-size: 16px; font-weight: 600; }

/* ---------------- welcome ---------------- */
.a-welcome { flex: 1; display: flex; flex-direction: column; padding: 8px 24px 30px; }
.a-welcome .a-lock { color: var(--a-on-brand); }
.a-routeart { position: relative; height: 300px; margin: 18px -24px 0; }
.a-routeart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.a-routeart .path { fill: none; stroke: var(--a-on-brand); stroke-opacity: .28; stroke-width: 2.5; stroke-dasharray: 2 8; stroke-linecap: round; }
.a-routeart .path.walked { stroke: var(--a-action); stroke-opacity: 1; stroke-dasharray: none; stroke-width: 3; }
.a-routeart .stop { fill: var(--a-brand); stroke: var(--a-action); stroke-width: 3; }
.a-routeart .stop.swap { stroke: var(--a-live); }
.a-ticket { position: absolute; max-width: 190px; display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--a-brand-2); font-size: 13px; line-height: 1.25; box-shadow: 0 0 0 1px var(--on-brand-line); }
.a-ticket b { font: 800 17px/1 var(--f-display); font-stretch: 75%; color: var(--a-action); }
.a-ticket.swap { background: var(--a-live); }
.a-ticket.swap b { color: var(--a-on-brand); }
.a-ticket s { opacity: .6; }
.a-welcome h1 { font: 800 56px/.9 var(--f-display); font-stretch: 75%; letter-spacing: -.015em; margin-top: auto; }
.a-welcome h1 em { font-style: normal; color: var(--a-action); }
.a-welcome p { font-size: 16px; color: var(--a-on-brand-2); margin: 14px 0 26px; line-height: 1.5; max-width: 32ch; }
.a-welcome .a-btn + .a-btn { margin-top: 8px; }

/* ---------------- home ---------------- */
.a-hello { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 18px; }
.a-hello small { display: block; font-size: 14.5px; color: var(--a-ink-2); }
.a-hello b { display: block; font: 800 34px/1 var(--f-display); font-stretch: 75%; margin-top: 4px; }
.a-hello .r { display: flex; gap: 6px; }
.a-avatar { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--a-calm); color: var(--a-calm-ink); font-weight: 700; font-size: 16px; }
.a-livecard { background: var(--a-brand); color: var(--a-on-brand); border-radius: var(--r-lg); padding: 20px; }
.a-livecard .row { display: flex; justify-content: space-between; align-items: center; }
.a-livecard .meta { font-size: 13.5px; color: var(--a-on-brand-2); }
.a-livecard .city { font: 800 64px/.9 var(--f-display); font-stretch: 75%; letter-spacing: -.02em; margin: 16px 0 6px; }
.a-next { margin: 18px 0 16px; padding: 14px 0 0; border-top: 1px solid var(--on-brand-line); display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.a-next .t { grid-row: span 2; font: 800 30px/1 var(--f-display); font-stretch: 75%; color: var(--a-action); }
.a-next b { font-size: 16px; font-weight: 600; }
.a-next span { font-size: 13.5px; color: var(--a-on-brand-2); }
.a-livecard .wx { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--a-on-brand-2); margin-bottom: 16px; }
.a-livecard .wx .ic { width: 17px; height: 17px; color: var(--sky-100); }
.a-plan { display: grid; grid-template-columns: 48px 1fr 20px; gap: 14px; align-items: center; width: 100%; padding: 16px; margin-top: 12px; }
.a-plan .plus { width: 48px; height: 48px; border-radius: var(--r-pill); background: var(--a-action); color: var(--a-on-action); display: grid; place-items: center; }
.a-plan b { display: block; font-size: 16px; font-weight: 600; }
.a-plan span { display: block; font-size: 13.5px; color: var(--a-ink-2); }
.a-plan > .ic { width: 18px; height: 18px; color: var(--a-ink-3); }
.a-idea { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: end; width: 100%; padding: 16px 18px; }
.a-idea + .a-idea { border-top: 1px solid var(--a-line); }
.a-idea .c { font: 800 30px/.95 var(--f-display); font-stretch: 75%; }
.a-idea .w { font-size: 13px; color: var(--a-ink-3); text-align: right; }
.a-idea p { grid-column: 1 / -1; font-size: 14px; color: var(--a-ink-2); }

/* ---------------- create ---------------- */
.a-title { font: 800 40px/.92 var(--f-display); font-stretch: 75%; letter-spacing: -.01em; margin: 4px 0 22px; }
.a-field { margin-bottom: 22px; }
.a-field > label, .a-field > .lab { display: block; font-size: 13.5px; font-weight: 600; color: var(--a-ink-2); margin-bottom: 8px; }
.a-input { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 16px; border-radius: var(--r-sm); background: var(--a-surface); box-shadow: inset 0 0 0 1.5px var(--a-line); font-size: 16px; }
.a-input.focus { box-shadow: inset 0 0 0 2px var(--a-brand); }
.a-input > .ic { color: var(--a-ink-3); }
.a-input span { flex: 1; }
.a-input small { font-size: 13px; color: var(--a-ink-3); }
.a-input .a-tag { margin-right: 6px; }
.a-fork { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.a-fork button { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--r-md); background: var(--a-surface); box-shadow: inset 0 0 0 1.5px var(--a-line); min-height: 146px; }
.a-fork button .ic { width: 26px; height: 26px; color: var(--forest-600); margin-bottom: 8px; }
.a-fork b { font: 800 22px/1 var(--f-display); font-stretch: 75%; }
.a-fork span { font-size: 13.5px; color: var(--a-ink-2); line-height: 1.4; }
.a-fork .on { box-shadow: inset 0 0 0 2px var(--a-brand); background: var(--a-calm); }
.a-fork .chk { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; border-radius: var(--r-pill); display: grid; place-items: center; background: var(--a-brand); color: var(--a-on-brand); }
.a-fork .chk .ic { width: 14px; height: 14px; color: var(--a-on-brand); margin: 0; }

<script>
/* PROTOTYPE PLAYER — replaces the design-file workspace with a single stage.
   Loaded after shell.js (icons + helpers) and before the app, so the app's
   FG.boot({...}) call lands here. Pages and docs are ignored; only the
   prototype, its flows and the brand lockup are used. */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  FG.boot = function (app) {
    var root = $("#pl"), device = $("#plDevice");
    var params = new URLSearchParams(location.search);
    if (params.has("embed")) root.classList.add("embed");
    $("#plBrand").innerHTML = app.brand || "";
    $("#plTag").textContent = app.tagline || "";
    var flows = app.proto.flows;
    function list(cls) {
      return flows.map(function (f, i) {
        return '<button type="button" data-flow="' + i + '" title="' + FG.esc(f.desc) + '">' + (cls === "full" ? "<b>" + FG.esc(f.name) + "</b><span>" + FG.esc(f.desc) + "</span>" : FG.esc(f.name)) + "</button>";
      });
    }
    $("#plFlows").innerHTML = list("full").map(function (b) { return "<li>" + b + "</li>"; }).join("");
    $("#plChips").innerHTML = list("chip").join("");
    function mark(i) {
      document.querySelectorAll("[data-flow]").forEach(function (b) { b.setAttribute("aria-current", String(+b.dataset.flow === i)); });
    }
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-flow]");
      if (b) { flows[+b.dataset.flow].go(); mark(+b.dataset.flow); $("#fgScreen").focus({ preventScroll: true }); }
    });
    $("#plRestart").addEventListener("click", function () { app.proto.restart(); mark(0); });
    window.addEventListener("keydown", function (e) {
      if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && !e.target.closest("#fgScreen")) { app.proto.restart(); mark(0); }
    });
    function fit() {
      var deck = $(".pl-deck"), w = deck.clientWidth, h = deck.clientHeight;
      var pad = root.classList.contains("embed") ? 12 : 40;
      device.style.transform = "translate(-50%, -50%) scale(" + Math.max(0.3, Math.min((h - pad) / 868, (w - 24) / 414, 1.05)) + ")";
    }
    window.addEventListener("resize", fit);
    var started = false;
    function start() {
      if (started) return; started = true;
      app.proto.mount($("#fgScreen"));
      mark(0); fit();
    }
    if (document.fonts && document.fonts.load) Promise.all((app.fonts || []).map(function (f) { return document.fonts.load(f); })).then(start, start);
    setTimeout(start, 2000);
    fit();
  };
})();

</script>

  function runGen() {
    var S = P.S, reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduced ? 160 : 880;
    S.gen = 0; S.genRun = true; paint(); S.genRun = false;
    GEN.forEach(function (g, i) {
      if (i === 0) return;
      P.t.push(setTimeout(function () {
        S.gen = i;
        var line = P.root.querySelector("#genLine"); if (line) line.textContent = GEN[i];
        Array.prototype.forEach.call(P.root.querySelectorAll(".a-steps i"), function (e, k) { e.classList.toggle("on", k <= i); });
      }, i * step));
    });
    P.t.push(setTimeout(function () { S.day = 0; go("itin"); }, GEN.length * step + 200));
  }
  function armNudge() {
    var S = P.S;
    if (S.nudgeDone || S.day !== 0 || S.active.d1b3 !== undefined) return;
    P.t.push(setTimeout(function () { if (S.screen === "itin" && S.day === 0 && !S.sheet) { S.nudge = true; paint(); } }, 3200));
  }
  function toast(msg, undo) {
    P.S.toast = { msg: msg, undo: undo || null }; paint();
    clearTimeout(P.toastT); P.toastT = setTimeout(function () { P.S.toast = null; paint(); }, 4500);
  }
  function act(a, v) {
    var S = P.S;
    switch (a) {
      case "go-home": go("home"); break;
      case "go-trips": go("trips"); break;
      case "go-create": go("create"); break;
      case "go-itin": go("itin"); break;
      case "go-gen": go("generating"); break;
      case "go-manual": go("manual"); break;
      case "who": S.who = v; paint(); break;
      case "like": if (S.likes[v]) delete S.likes[v]; else S.likes[v] = 1; paint(); break;
      case "path": S.path = v; paint(); break;
      case "day": S.day = +v; S.nudge = false; paint(); P.root.querySelector(".a-scroll").scrollTop = 0; if (S.day === 0) armNudge(); break;
      case "mday": S.mday = +v; paint(); break;
      case "wx-close": S.wx = false; paint(); break;
      case "adjust": S.sheet = { base: v, reason: null }; S.nudge = false; S.toast = null; paint(); break;
      case "reason": S.sheet.reason = v; paint(); break;
      case "sheet-close": S.sheet = null; paint(); break;
      case "swap":
        var base = block(S.sheet.base), idx = base.alts.findIndex(function (x) { return x.why === S.sheet.reason; });
        S.lastSwap = { id: base.id, prev: S.active[base.id] };
        S.active[base.id] = idx; S.sheet = null; if (base.id === "d1b3") S.nudgeDone = true;
        toast("Swapped for " + esc(base.alts[idx].name) + ".", true); break;
      case "restore": delete S.active[S.sheet.base]; S.sheet = null; toast("Back to the original plan."); break;
      case "undo":
        if (S.lastSwap) { if (S.lastSwap.prev === undefined) delete S.active[S.lastSwap.id]; else S.active[S.lastSwap.id] = S.lastSwap.prev; S.lastSwap = null; }
        S.toast = null; paint(); break;
      case "nudge-yes":
        S.lastSwap = { id: "d1b3", prev: undefined }; S.active.d1b3 = 0; S.nudge = false; S.nudgeDone = true;
        toast("Swapped for Chai at Tapri Central.", true); break;
      case "nudge-no": S.nudge = false; S.nudgeDone = true; toast("Keeping Johri Bazaar. I’ll stay quiet about it."); break;
      case "pick": S.picker = v; paint(); break;
      case "picker-close": S.picker = null; paint(); break;
      case "picked": S.manual[S.mday + ":" + S.picker] = +v; S.picker = null; paint(); break;
      case "unpick": delete S.manual[S.mday + ":" + v]; paint(); break;
      case "save-manual": toast("Day " + (S.mday + 1) + " saved. Awara is watching it."); break;
      default:
        if (a && a.indexOf("noop") === 0) toast("Not part of this prototype.");
    }
  }
  function restart() { clearTimers(); clearTimeout(P.toastT); P.S = initial(); paint(); }
  var proto = {
    note: "Every button works. Start on the welcome screen, plan a trip either way, watch the draft build, then bend the itinerary: adjust any stop by reason, accept or refuse the live crowd nudge on Day 1, undo swaps, or build a day by hand.",
    flows: [
      { name: "First open", desc: "Welcome, then home with a live trip.", go: function () { proto.go("welcome"); } },
      { name: "Plan with Awara", desc: "Create, choose a path, watch it draft.", go: function () { proto.go("create"); } },
      { name: "Bend the plan", desc: "Day 1, live crowd nudge after 3 seconds.", go: function () { proto.go("itin"); } },
      { name: "Adjust a stop", desc: "Pick a reason, get one honest swap.", go: function () { proto.go("adjust"); } },
      { name: "Build by hand", desc: "Fill empty slots from local picks.", go: function () { proto.go("manual"); } }
    ],
    mount: function (el) {
      P.root = el; restart();
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act]");
        if (b && !b.disabled && el.contains(b)) act(b.dataset.act, b.dataset.v);
      });
      el.addEventListener("keydown", function (e) {
        var S = P.S;
        if (e.key === "Escape") { if (S.sheet) act("sheet-close"); else if (S.picker) act("picker-close"); return; }
        if (e.key === "Tab") {
          var ov = el.querySelector('[role="dialog"]'); if (!ov) return;
          var f = ov.querySelectorAll("button:not([disabled])"); if (!f.length) return;
          if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
        }
      });
    },
    go: function (key) {
      clearTimers(); clearTimeout(P.toastT);
      P.S = preset((key || "welcome").replace("-long", "")); P.S.long = false; P.S.toast = null;
      paint();
      if (P.S.screen === "generating") runGen();
      if (P.S.screen === "itin" && !P.S.sheet) armNudge();
    },
    restart: restart
  };

  FG.boot({
    brand: lockup(), tagline: "A travel plan that bends with the day. Awara drafts the trip, then adjusts one stop at a time when it rains, the crowds build or you run late.",
    fonts: ['800 16px "Bricolage Grotesque"', '700 16px "Bricolage Grotesque"', '400 16px "Instrument Sans"', '500 16px "Instrument Sans"', '600 16px "Instrument Sans"'],
    file: "Awara — Design System", version: "v2.0",
    vars: ["--a-bg", "--a-surface", "--a-sunken", "--a-line", "--a-ink", "--a-ink-2", "--a-ink-3", "--a-brand", "--a-action", "--a-on-action", "--a-live", "--a-live-ink", "--a-calm", "--a-sky", "--a-sky-soft"],
    textStyles: [["Display / City", "64 · 800"], ["Display / Hero", "56 · 800"], ["Title / L", "40 · 800"], ["Title / M", "30 · 800"], ["Card title", "21 · 700"], ["Time", "23 · 800"], ["Body / L", "16 · 400"], ["Body / M", "14 · 400"], ["Label", "13.5 · 600"], ["Overline", "12 · 600"]],
    pages: pages(),
    proto: proto
  });
})();

</script>
