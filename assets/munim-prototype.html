<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munim prototype</title>
<meta name="description" content="Munim rebrand: design system, components, screens and clickable prototype for delegating UPI payments to an AI agent.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,300..800&family=Anek+Devanagari:wght@500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* =====================================================================
   PROTOTYPE PLAYER — a presentation stage for one product, like a
   prototype shared from a design tool: the phone, its flows, nothing else.
   Each app sets --pl-* on :root in its own CSS.
   ===================================================================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { overflow: hidden; background: var(--pl-bg); color: var(--pl-ink); font-family: var(--pl-font); -webkit-font-smoothing: antialiased; }
.pl button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
.pl :focus-visible { outline: 2px solid var(--pl-accent); outline-offset: 3px; }
.pl {
  height: 100vh; height: 100dvh;
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
}
.pl-rail { display: flex; flex-direction: column; gap: 28px; padding: 44px 36px 32px 44px; overflow-y: auto; scrollbar-width: none; }
.pl-brand { display: flex; align-items: center; gap: 10px; }
.pl-tag { font-size: 15px; line-height: 1.55; color: var(--pl-muted); max-width: 30ch; }
.pl-h { font-size: 11.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pl-muted); margin-bottom: 10px; }
.pl-flows ol { list-style: none; display: grid; gap: 2px; counter-reset: flow; }
.pl-flows button {
  width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; align-items: baseline;
  padding: 10px 12px; border-radius: 14px; transition: background .2s;
}
.pl-flows button::before { counter-increment: flow; content: counter(flow, decimal-leading-zero); grid-row: span 2; font-size: 12px; font-weight: 600; color: var(--pl-muted); font-variant-numeric: tabular-nums; }
.pl-flows button b { font-size: 15px; font-weight: 600; }
.pl-flows button span { grid-column: 2; font-size: 13px; line-height: 1.45; color: var(--pl-muted); }
.pl-flows button:hover { background: var(--pl-hover); }
.pl-flows button[aria-current="true"] { background: var(--pl-chip); }
.pl-flows button[aria-current="true"]::before { color: var(--pl-accent); }
.pl-foot { margin-top: auto; display: grid; gap: 12px; }
.pl-restart { display: inline-flex; align-items: center; gap: 8px; justify-self: start; height: 40px; padding: 0 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--pl-line); font-size: 14px; font-weight: 600; }
.pl-restart:hover { background: var(--pl-hover); }
.pl-restart svg { width: 16px; height: 16px; }
.pl-hint { font-size: 12.5px; line-height: 1.5; color: var(--pl-muted); }
.pl-hint kbd { font: inherit; font-weight: 600; color: var(--pl-ink); }
.pl-deck { position: relative; display: grid; place-items: center; overflow: hidden; }
.pl-device {
  flex: none; width: 414px; height: 868px; padding: 12px; border-radius: 60px; background: #0B0B0B;
  box-shadow: 0 0 0 1.5px var(--pl-bezel-line), 0 50px 90px -34px var(--pl-shadow);
  position: absolute; left: 50%; top: 50%; transform-origin: center;
}
.pl-screen { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; isolation: isolate; }
.pl-chips { display: none; }

/* hotspot hint, same behaviour as a design-tool prototype */
.fg-hint :is(button, [data-act], [role="button"], [role="switch"], [role="tab"]):not([disabled]) {
  outline: 2px solid rgba(13, 153, 255, .75) !important; outline-offset: -1px;
  background-color: rgba(13, 153, 255, .14) !important;
}

/* narrow: the phone leads, flows become a chip row under it */
@media (max-width: 860px) {
  .pl { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto; }
  .pl-rail { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 18px; gap: 12px; }
  .pl-tag, .pl-flows, .pl-hint { display: none; }
  .pl-foot { margin: 0; }
  .pl-chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 16px; scrollbar-width: none; }
  .pl-chips button { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--pl-line); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pl-chips button[aria-current="true"] { background: var(--pl-chip); box-shadow: none; }
}
/* embedded in the portfolio: phone only */
.pl.embed { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.pl.embed .pl-rail, .pl.embed .pl-chips { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* =====================================================================
   MUNIM 4.0 — "The quiet bookkeeper"
   Tokens: primitive -> semantic. Components read semantic tokens only.
   ===================================================================== */
:root {
  /* primitives */
  --navy-950: #0A1430; --navy-900: #111D45; --navy-800: #1C2C5E; --navy-700: #2B4181; --navy-500: #5268A6; --navy-300: #A4B2D5; --navy-100: #DEE4F2; --navy-50: #F0F3F9;
  --slate-600: #3E4864; --slate-400: #646D8C;
  --ivory-50: #FBF9F4; --ivory-100: #F4F0E6; --ivory-200: #E8E1D0; --ivory-300: #D5CAB2;
  --emerald-700: #0A5A43; --emerald-600: #0E7454; --emerald-400: #45B98E; --emerald-100: #D8EEE4;
  --marigold-700: #83550A; --marigold-500: #E39A16; --marigold-300: #F5C45E; --marigold-100: #FCEDCC;
  --sindoor-700: #8C1E16; --sindoor-600: #B3291E; --sindoor-100: #F8E1DC;
  --white: #FFFFFF;
  --veil: rgba(10, 20, 48, .46);
  --on-brand-line: rgba(240, 243, 249, .14);

  /* semantic */
  --m-bg: var(--ivory-50); --m-surface: var(--white); --m-sunken: var(--ivory-100); --m-line: var(--ivory-200); --m-line-2: var(--ivory-300);
  --m-ink: var(--navy-950); --m-ink-2: var(--slate-600); --m-ink-3: var(--slate-400);
  --m-brand: var(--navy-900); --m-brand-press: var(--navy-800); --m-on-brand: var(--ivory-50); --m-on-brand-2: var(--navy-300);
  --m-trust: var(--emerald-600); --m-trust-ink: var(--emerald-700); --m-trust-soft: var(--emerald-100); --m-trust-bright: var(--emerald-400);
  --m-hold: var(--marigold-500); --m-hold-ink: var(--marigold-700); --m-hold-soft: var(--marigold-100); --m-hold-bright: var(--marigold-300);
  --m-stop: var(--sindoor-600); --m-stop-ink: var(--sindoor-700); --m-stop-soft: var(--sindoor-100);

  /* shape, space, type, elevation */
  --r-pill: 999px; --r-sm: 10px; --r-md: 18px; --r-lg: 28px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px; --s-12: 48px;
  --f-ui: 'Anek Latin', system-ui, sans-serif;
  --f-voice: 'Instrument Serif', Georgia, serif;
  --f-deva: 'Anek Devanagari', 'Nirmala UI', sans-serif;
  --e-1: 0 1px 2px rgba(10, 20, 48, .05), 0 0 0 1px var(--ivory-200);
  --e-2: 0 16px 36px -14px rgba(10, 20, 48, .28);
  --e-3: 0 -16px 48px -8px rgba(10, 20, 48, .28);
  --ease: cubic-bezier(.2, .8, .2, 1);

  /* documentation skin */
  --doc-bg: var(--ivory-50); --doc-ink: var(--navy-950); --doc-ink-2: var(--slate-600); --doc-line: var(--ivory-200);
  --doc-accent: var(--emerald-700); --doc-accent-soft: var(--emerald-100); --doc-sunken: var(--ivory-100);
  --doc-body: var(--f-ui); --doc-h2: 600 52px/1.02 var(--f-ui); --doc-h4: 600 19px/1.25 var(--f-ui);
  --doc-r: var(--r-md); --doc-r-sm: var(--r-sm); --doc-good: var(--emerald-700); --doc-bad: var(--sindoor-600);
}

/* prototype stage */
:root { --pl-bg: var(--navy-950); --pl-ink: var(--ivory-50); --pl-muted: var(--navy-300); --pl-line: rgba(240, 243, 249, .2);
  --pl-hover: rgba(240, 243, 249, .06); --pl-chip: rgba(240, 243, 249, .1); --pl-accent: var(--marigold-300);
  --pl-bezel-line: rgba(240, 243, 249, .12); --pl-shadow: rgba(0, 0, 0, .7); --pl-font: var(--f-ui); }
.pl-brand .m-mark { color: var(--ivory-50); }
.pl-brand .m-word { font-size: 26px; }

/* ---------------- screen ---------------- */
.m {
  width: 390px; height: 844px; position: relative; display: flex; flex-direction: column;
  background: var(--m-bg); color: var(--m-ink); font: 400 15px/1.45 var(--f-ui);
  font-variant-numeric: tabular-nums; overflow: hidden; -webkit-font-smoothing: antialiased; text-align: left;
}
.m.long { height: auto; }
.m.long .m-scroll { overflow: visible; flex: none; }
.m-kit { font: 400 15px/1.45 var(--f-ui); color: var(--m-ink); font-variant-numeric: tabular-nums; text-align: left; -webkit-font-smoothing: antialiased; }
:is(.m, .m-kit) button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
:is(.m, .m-kit) button:disabled { cursor: default; opacity: .4; }
.m :focus-visible { outline: 2px solid var(--navy-500); outline-offset: 2px; }
:is(.m, .m-kit) .ic { width: 20px; height: 20px; flex: none; }
.m-status { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 30px 0 36px; font-weight: 600; font-size: 16px; }
.m-status .gl { display: flex; gap: 6px; align-items: center; }
.m-status svg { fill: currentColor; }
.m-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--s-5) var(--s-8); scrollbar-width: none; }
.m-scroll::-webkit-scrollbar { display: none; }

/* brand lockup */
.m-mark { width: 30px; height: 30px; color: var(--m-brand); }
.m-mark .dot { fill: var(--m-hold); }
.m-mark .rule { stroke-width: 1.6; }
.m-word { font: 650 22px/1 var(--f-ui); letter-spacing: -.025em; }
.m-top { display: flex; align-items: center; justify-content: space-between; padding: var(--s-2) 0 var(--s-4); }
.m-brand { display: flex; align-items: center; gap: 10px; }
.m-duty { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 12px; border-radius: var(--r-pill); background: var(--m-trust-soft); color: var(--m-trust-ink); font-size: 13.5px; font-weight: 600; }
.m-duty i { width: 7px; height: 7px; border-radius: var(--r-pill); background: var(--m-trust); }
.m-duty.paused { background: var(--m-hold-soft); color: var(--m-hold-ink); }
.m-duty.paused i { background: var(--m-hold); }

/* hero: the khata cover */
.m-hero { background: var(--m-brand); color: var(--m-on-brand); border-radius: var(--r-lg); padding: 22px 22px 18px; }
.m-over { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--m-on-brand-2); }
.m-amt { display: flex; align-items: flex-start; gap: 3px; font: 600 56px/1 var(--f-ui); font-stretch: 90%; letter-spacing: -.035em; margin: 12px 0 6px; }
.m-amt .cur { font-size: .5em; line-height: 1.25; letter-spacing: 0; font-weight: 500; opacity: .75; }
.m-of { font-size: 14.5px; color: var(--m-on-brand-2); }
.m-of b { color: var(--m-on-brand); font-weight: 600; }
.m-meter { position: relative; height: 8px; margin-top: 18px; border-radius: var(--r-pill); background: var(--on-brand-line); overflow: hidden; }
.m-meter i { position: absolute; inset: 0; background: var(--m-on-brand); border-radius: var(--r-pill); transform-origin: left; transform: scaleX(var(--p, .2)); }
.m-meter.on-light { background: var(--m-line); }
.m-meter.on-light i { background: var(--m-brand); }
.m-meter.full i { background: var(--m-hold); }
.m-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--m-on-brand-2); margin-top: 8px; }
.m-hfoot { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--on-brand-line); font-size: 13px; color: var(--m-on-brand-2); }
.m-hfoot .ic { width: 16px; height: 16px; }

/* sections + cards */
.m-sec { display: flex; align-items: center; justify-content: space-between; margin: 30px 4px 12px; }
.m-sec h2, .m-sec h3 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.m-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--r-pill); background: var(--navy-100); color: var(--navy-800); font-size: 12.5px; font-weight: 650; }
.m-sec small { font-size: 13px; color: var(--m-ink-3); }
.m-card { background: var(--m-surface); border-radius: var(--r-md); box-shadow: var(--e-1); overflow: hidden; }
.m-card > * + * { border-top: 1px solid var(--m-line); }
.m-card:is(.m-amtcard, .m-chart, .m-ladder) > * + * { border-top: 0; }

/* avatars */
.m-av { width: 40px; height: 40px; border-radius: var(--r-sm); display: grid; place-items: center; font-weight: 650; font-size: 16px; background: var(--navy-100); color: var(--navy-800); flex: none; }
.m-av.t-green { background: var(--m-trust-soft); color: var(--m-trust-ink); }
.m-av.t-gold { background: var(--m-hold-soft); color: var(--m-hold-ink); }
.m-av.t-red { background: var(--m-stop-soft); color: var(--m-stop-ink); }
.m-av.lg { width: 56px; height: 56px; border-radius: var(--r-md); font-size: 22px; }
.m-av.sm { width: 32px; height: 32px; font-size: 13.5px; }

/* badges */
.m-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: var(--r-pill); font-size: 12px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; background: var(--navy-100); color: var(--navy-800); }
.m-badge.trust { background: var(--m-trust-soft); color: var(--m-trust-ink); }
.m-badge.hold { background: var(--m-hold-soft); color: var(--m-hold-ink); }
.m-badge.stop { background: var(--m-stop-soft); color: var(--m-stop-ink); }
.m-badge.brand { background: var(--m-brand); color: var(--m-on-brand); }
.m-badge .ic { width: 13px; height: 13px; }

/* queue row */
.m-q { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 14px 16px; }
.m-q:hover { background: var(--m-bg); }
.m-q-name { display: block; font-size: 16px; font-weight: 600; }
.m-q-line { display: block; font-size: 13.5px; color: var(--m-ink-2); line-height: 1.4; margin-top: 2px; }
.m-q-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.m-q-amt b { font-size: 16px; font-weight: 650; }

/* hold card */
.m-hold { position: relative; margin-top: 12px; }
.m-hold-in { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 14px 16px 14px; }
.m-hold-open { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.m-timer { display: grid; place-items: center; min-width: 68px; height: 48px; padding: 0 10px; border-radius: var(--r-sm); background: var(--m-hold-soft); color: var(--m-hold-ink); font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.m-timer.frozen { background: var(--m-sunken); color: var(--m-ink-3); }
.m-hold-txt b { display: block; font-size: 15px; font-weight: 600; }
.m-hold-txt span { display: block; font-size: 13px; color: var(--m-ink-2); line-height: 1.35; margin-top: 2px; }
.m-pillbtn { height: 36px; padding: 0 14px; border-radius: var(--r-pill); box-shadow: inset 0 0 0 1.5px var(--m-line-2); font-size: 14px; font-weight: 650; background: var(--m-surface); }
.m-pillbtn:hover { box-shadow: inset 0 0 0 1.5px var(--m-ink); }
.m-pillbtn.stop { color: var(--m-stop-ink); background: var(--m-stop-soft); box-shadow: none; }
.m-drain { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--m-line); border: 0 !important; }
.m-drain i { position: absolute; inset: 0; background: var(--m-hold); transform-origin: left; transform: scaleX(var(--p, 1)); transition: transform 1s linear; }

/* ledger */
.m-lr { display: grid; grid-template-columns: 38px 1fr auto; gap: 12px; padding: 14px 16px; align-items: start; }
.m-lr.fresh { animation: m-fresh 2.4s var(--ease); }
@keyframes m-fresh { from { background: var(--m-trust-soft); } to { background: var(--m-surface); } }
.m-date { display: flex; flex-direction: column; align-items: center; line-height: 1; padding-top: 2px; }
.m-date b { font-size: 18px; font-weight: 650; }
.m-date span { font-size: 11px; font-weight: 600; color: var(--m-ink-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }
.m-lr-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15.5px; font-weight: 600; }
.m-lr-note { display: block; font: italic 400 16px/1.3 var(--f-voice); color: var(--m-ink-2); margin-top: 3px; }
.m-lr-amt { font-size: 15.5px; font-weight: 650; padding-top: 1px; }
.m-lr-amt.out { color: var(--m-ink-3); text-decoration: line-through; font-weight: 500; }
.m-split { padding: 16px; }
.m-split-bar { display: flex; gap: 3px; height: 10px; }
.m-split-bar i { flex-grow: var(--g); border-radius: var(--r-pill); background: var(--c); }
.m-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 13px; color: var(--m-ink-2); }
.m-legend span { display: inline-flex; align-items: center; gap: 6px; }
.m-legend i { width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--c); }
.m-legend b { color: var(--m-ink); font-weight: 600; }
.m-next { display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 14.5px; }
.m-next .ic { color: var(--m-ink-3); }
.m-next span { flex: 1; }
.m-next small { display: block; color: var(--m-ink-3); font-size: 12.5px; }
.m-next b { font-weight: 650; }

/* tab bar */
.m-tabs { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 18px 28px; background: var(--m-surface); border-top: 1px solid var(--m-line); }
.m-tabs button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--m-ink-3); text-align: center; }
.m-tabs .pill { display: grid; place-items: center; width: 60px; height: 32px; border-radius: var(--r-pill); }
.m-tabs .ic { width: 22px; height: 22px; }
.m-tabs .on { color: var(--m-ink); }
.m-tabs .on .pill { background: var(--navy-100); }

/* detail screens */
.m-nav { display: flex; align-items: center; gap: 6px; height: 52px; flex: none; padding: 0 12px; }
.m-nav .t { font-size: 16px; font-weight: 600; }
.m-back { width: 44px; height: 44px; border-radius: var(--r-pill); display: grid; place-items: center; }
.m-back:hover { background: var(--m-sunken); }
.m-back .ic { width: 22px; height: 22px; }
.m-mhead { display: flex; align-items: center; gap: 14px; margin: 6px 0 22px; }
.m-mhead h1 { font-size: 23px; font-weight: 650; letter-spacing: -.015em; line-height: 1.1; }
.m-mhead .row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.m-voice { margin: 0 0 22px; }
.m-said { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--m-ink-3); margin-bottom: 8px; }
.m-said svg { width: 18px; height: 18px; color: var(--m-brand); }
.m-said .dot { fill: var(--m-hold); }
.m-q-voice { font: italic 400 27px/1.2 var(--f-voice); letter-spacing: -.005em; color: var(--m-ink); }
.m-q-voice.md { font-size: 22px; line-height: 1.25; }
.m-amtcard { padding: 20px; }
.m-amtcard .lab { font-size: 12px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: var(--m-ink-3); }
.m-amtcard .big { display: flex; align-items: baseline; gap: 10px; font: 600 46px/1.05 var(--f-ui); font-stretch: 90%; letter-spacing: -.03em; margin: 8px 0 10px; }
.m-amtcard .big s { font-size: 20px; font-weight: 500; letter-spacing: -.01em; color: var(--m-ink-3); }
.m-cmp { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.m-cmp.pos { color: var(--m-trust-ink); }
.m-cmp.neg { color: var(--m-stop-ink); }
.m-cmp .ic { width: 16px; height: 16px; }
.m-fact { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; font-size: 14.5px; }

/* anomaly chart */

.m-ob-safe { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; width: 100%; }

<script>
/* =====================================================================

      if (n !== hov) { hov = n; draw(); }
    });
    function end(e) {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinch = null;
      if (drag && !drag.moved && !drag.force) select(hit(drag.target));
      drag = null; c.classList.remove("panning");
    }
    c.addEventListener("pointerup", end);
    c.addEventListener("pointercancel", end);
    c.addEventListener("pointerleave", function () { if (hov) { hov = null; draw(); } });
    c.addEventListener("dblclick", function (e) { var n = hit(e.target); if (n) select(n, true); });
    window.addEventListener("keydown", function (e) { if (e.code === "Space" && !isField(e.target)) { space = true; c.classList.add("hand"); } });
    window.addEventListener("keyup", function (e) { if (e.code === "Space") { space = false; if (tool !== "hand") c.classList.remove("hand"); } });
  }
  function hit(t) {
    var ne = t && t.closest && t.closest(".fg-node");
    return ne ? nodes.find(function (n) { return n.el === ne; }) || null : null;
  }
  function isField(t) { return t && /INPUT|SELECT|TEXTAREA/.test(t.tagName); }
  function bindKeys() {
    window.addEventListener("keydown", function (e) {
      if (isField(e.target)) return;
      var proto = cur().type === "proto";
      if (e.key === "Escape") { el.menu.hidden = true; if (!proto && sel) select(null); return; }
      if (proto) { if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && !e.target.closest("#fgScreen")) A.proto.restart(); return; }
      if (e.shiftKey && e.key === "!") { e.preventDefault(); fitAll(); }
      else if (e.shiftKey && (e.code === "Digit1")) { e.preventDefault(); fitAll(); }
      else if (e.shiftKey && e.code === "Digit2") { e.preventDefault(); if (sel) select(sel, true); }
      else if (e.shiftKey && e.code === "Digit0") { e.preventDefault(); zoomCenter(1 / view.z); }
      else if ((e.key === "=" || e.key === "+") && !e.ctrlKey) zoomCenter(1.25);
      else if (e.key === "-" && !e.ctrlKey) zoomCenter(0.8);

      else if (e.key === "v" || e.key === "V") setTool("move");

  function setTool(t) {

  /* ---------- toolbar ---------- */
  function bindToolbar() {
    $$("[data-tool]").forEach(function (b) { b.addEventListener("click", function () { setTool(b.dataset.tool); }); });
    el.zoom.addEventListener("click", function (e) {
      e.stopPropagation();

    });
    el.menu.addEventListener("click", function (e) {
      var b = e.target.closest("[data-z]"); if (!b) return;
      var z = b.dataset.z;
      if (z === "in") zoomCenter(1.25); else if (z === "out") zoomCenter(0.8);

    $("#fgPresent").addEventListener("click", function () {

    $("#fgShare").addEventListener("click", function () {
      var url = location.href;
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast("Link to this page copied"); }, function () { toast("Copy the address bar to share this page"); });
      else toast("Copy the address bar to share this page");
    });
  }
  var tt;
  function toast(msg) { el.toast.textContent = msg; el.toast.hidden = false; clearTimeout(tt); tt = setTimeout(function () { el.toast.hidden = true; }, 2200); }

  /* ---------- left panel ---------- */
  function renderLayers() {
    var p = cur();
    if (p.type === "proto") {
      $("#fgLayersTitle").innerHTML = "Flows <small>starting points</small>";

      el.layers.innerHTML = A.proto.flows.map(function (f, i) {
        return '<li><button data-flow="' + i + '"><b>' + ic("play") + esc(f.name) + "</b><small>" + esc(f.desc) + "</small></button></li>";

  function onLayer(e) {

    if (f) { A.proto.flows[+f.dataset.flow].go(); return; }

    if (n) { select(nodes[+n.dataset.node], true); return; }
    var s = e.target.closest("[data-sec]");

  /* ---------- right panel ---------- */
  function renderRight() {
    var p = cur(), h = "";
    if (p.type === "proto") {
      h = '<div class="fg-tabs"><button class="on">Prototype</button></div>' +
        '<div class="fg-block"><div class="fg-h">Device</div><div class="fg-prop"><div class="fg-field wide">iPhone 15 · 390 × 844</div></div></div>' +
        '<div class="fg-block"><div class="fg-h">Interactions</div><p class="fg-note">' + esc(A.proto.note) + "</p></div>" +
        '<div class="fg-block"><div class="fg-h">Tips</div><p class="fg-note">Click anywhere that is not a control and every hotspot on the screen lights up.</p>' +
        '<button class="fg-cta ghost" data-act-r="restart">' + ic("restart") + "Restart prototype</button></div>";
      el.right.innerHTML = h; return;
    }
    h = '<div class="fg-tabs" role="tablist"><button role="tab" data-tab="design" aria-selected="' + (rightTab === "design") + '" class="' + (rightTab === "design" ? "on" : "") + '">Design</button>' +
      '<button role="tab" data-tab="inspect" aria-selected="' + (rightTab === "inspect") + '" class="' + (rightTab === "inspect" ? "on" : "") + '">Inspect</button></div>';
    if (sel) {
      var it = sel.it;
      if (rightTab === "inspect") {
        h += '<div class="fg-block"><div class="fg-h">Code <small>CSS</small></div><pre class="fg-code">' + inspectCss(sel) + "</pre></div>";
        if (it.tokens) h += '<div class="fg-block"><div class="fg-h">Tokens used</div>' + it.tokens.map(varRow).join("") + "</div>";
      } else {
        h += '<div class="fg-block"><div class="fg-h">' + (it.kind === "set" ? "Component set" : "Frame") + "</div>" +
          '<div class="fg-prop"><div class="fg-field wide">' + esc(it.name) + "</div>" +
          '<div class="fg-field"><i>X</i>' + Math.round(sel.x) + '</div><div class="fg-field"><i>Y</i>' + Math.round(sel.y) + "</div>" +
          '<div class="fg-field"><i>W</i>' + Math.round(sel.w) + '</div><div class="fg-field"><i>H</i>' + Math.round(sel.h) + "</div></div></div>";
        if (it.fill) h += '<div class="fg-block"><div class="fg-h">Fill</div>' + varRow(it.fill) + "</div>";
        if (it.note) h += '<div class="fg-block"><div class="fg-h">Notes</div><p class="fg-note">' + it.note + "</p></div>";
        if (it.proto) h += '<div class="fg-block"><button class="fg-cta" data-act-r="open-proto">' + ic("play") + "Open in prototype</button></div>";
      }
    } else {
      h += '<div class="fg-block"><div class="fg-h">Page</div><p class="fg-note">' + esc(p.about || "") + "</p></div>" +
        '<div class="fg-block"><div class="fg-h">Local variables <small>' + A.vars.length + "</small></div>" + A.vars.map(varRow).join("") + "</div>" +
        '<div class="fg-block"><div class="fg-h">Text styles <small>' + A.textStyles.length + "</small></div>" +
        A.textStyles.map(function (t) { return '<div class="fg-var"><span class="ts">Ag</span>' + esc(t[0]) + '<span class="v">' + esc(t[1]) + "</span></div>"; }).join("") + "</div>";
    }
    el.right.innerHTML = h;
  }
  function varRow(v) { return '<div class="fg-var"><span class="sw" style="--sw:var(' + v + ')"></span>' + v.replace(/^--/, "") + '<span class="v">' + getVar(v) + "</span></div>"; }
  function getVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim().toUpperCase(); }
  function inspectCss(n) {
    var it = n.it, lines = [];
    lines.push('<span class="k">width</span>: <span class="s">' + Math.round(n.w) + "px</span>;");
    lines.push('<span class="k">height</span>: <span class="s">' + Math.round(n.h) + "px</span>;");
    if (it.fill) lines.push('<span class="k">background</span>: <span class="s">var(' + it.fill + ")</span>;");
    (it.css || []).forEach(function (c) { lines.push('<span class="k">' + c[0] + '</span>: <span class="s">' + esc(c[1]) + "</span>;"); });
    return lines.join("\n");
  }
  function onRight(e) {
    var t = e.target.closest("[data-tab]");
    if (t) { rightTab = t.dataset.tab; renderRight(); return; }
    var a = e.target.closest("[data-act-r]");
    if (!a) return;
    if (a.dataset.actR === "restart") A.proto.restart();
    if (a.dataset.actR === "open-proto" && sel) {
      var st = sel.it.proto;
      openPage(pages.findIndex(function (p) { return p.type === "proto"; }));

    }
  }

  /* ---------- prototype player ---------- */
  function fitDevice() {
    var d = $(".fg-device"), cw = el.canvas.clientWidth, ch = el.canvas.clientHeight;
    var embed = el.fg.classList.contains("embed");
    var s = Math.min((ch - (embed ? 16 : 64)) / 868, (cw - 24) / 414, 1.1);
    d.style.transform = "scale(" + Math.max(0.3, s) + ")";
  }
  document.addEventListener("click", function (e) {
    var scr = e.target.closest && e.target.closest("#fgScreen");
    if (!scr) return;
    if (e.target.closest("button, a, input, label, select, textarea, [data-act], [role=button], [role=switch], [role=tab]")) return;
    scr.classList.add("fg-hint");
    setTimeout(function () { scr.classList.remove("fg-hint"); }, RM.matches ? 900 : 500);
  });
  FG.toast = toast;
})();

<script>
/* PROTOTYPE PLAYER — replaces the design-file workspace with a single stage.
   Loaded after shell.js (icons + helpers) and before the app, so the app's
   FG.boot({...}) call lands here. Pages and docs are ignored; only the
   prototype, its flows and the brand lockup are used. */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  FG.boot = function (app) {
    var root = $("#pl"), device = $("#plDevice");
    var params = new URLSearchParams(location.search);
    if (params.has("embed")) root.classList.add("embed");
    $("#plBrand").innerHTML = app.brand || "";
    $("#plTag").textContent = app.tagline || "";
    var flows = app.proto.flows;
    function list(cls) {
      return flows.map(function (f, i) {
        return '<button type="button" data-flow="' + i + '" title="' + FG.esc(f.desc) + '">' + (cls === "full" ? "<b>" + FG.esc(f.name) + "</b><span>" + FG.esc(f.desc) + "</span>" : FG.esc(f.name)) + "</button>";
      });
    }
    $("#plFlows").innerHTML = list("full").map(function (b) { return "<li>" + b + "</li>"; }).join("");
    $("#plChips").innerHTML = list("chip").join("");
    function mark(i) {
      document.querySelectorAll("[data-flow]").forEach(function (b) { b.setAttribute("aria-current", String(+b.dataset.flow === i)); });
    }
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-flow]");
      if (b) { flows[+b.dataset.flow].go(); mark(+b.dataset.flow); $("#fgScreen").focus({ preventScroll: true }); }
    });
    $("#plRestart").addEventListener("click", function () { app.proto.restart(); mark(0); });
    window.addEventListener("keydown", function (e) {
      if ((e.key === "r" || e.key === "R") && !e.ctrlKey && !e.metaKey && !e.target.closest("#fgScreen")) { app.proto.restart(); mark(0); }
    });
    function fit() {
      var deck = $(".pl-deck"), w = deck.clientWidth, h = deck.clientHeight;
      var pad = root.classList.contains("embed") ? 12 : 40;
      device.style.transform = "translate(-50%, -50%) scale(" + Math.max(0.3, Math.min((h - pad) / 868, (w - 24) / 414, 1.05)) + ")";
    }
    window.addEventListener("resize", fit);
    var started = false;
    function start() {
      if (started) return; started = true;
      app.proto.mount($("#fgScreen"));
      mark(0); fit();
    }
    if (document.fonts && document.fonts.load) Promise.all((app.fonts || []).map(function (f) { return document.fonts.load(f); })).then(start, start);
    setTimeout(start, 2000);
    fit();
  };
})();

</script>
<script>

      '<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A10 10 0 0 0 8 .6 10 10 0 0 0 .9 3.5L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.2c.6 0 1.1.2 1.5.6L8 10.8 6.5 9.2c.4-.4.9-.6 1.5-.6Z"/></svg>' +

  /* onboarding: Munim introduces himself */
  var OB = [
    { voice: "I'm your munim. I keep the khata, and I ask before I spend.",

      fig: function () { return '<div class="m-mini">' + lrow({ d: 19, m: "Airtel Postpaid", amt: 239, note: "Same as every month." }) + lrow({ d: 18, m: "BESCOM", amt: 1430, note: "₹126 less than June." }) + lrow({ d: 17, m: "Payment link", amt: 2999, stamp: "Refused", note: "Not a merchant I know.", out: true }) + "</div>"; } },
    { voice: "Trust is earned one merchant at a time.",
      sub: "New names start supervised: I ask, you approve with your UPI PIN. After three approvals I propose paying that merchant alone, under a cap you set.",
      fig: function () { return '<div class="m-ob-ladder"><div class="r">' + badge("", "Supervised") + "<small>Asks every time</small></div>" + '<div class="mid"><span class="m-dots"><i class="f"></i><i class="f"></i><i class="f"></i></span>3 APPROVALS</div><div class="r">' + badge("trust", "Trusted") + "<small>Pays alone, under a cap</small></div></div>"; } },

  ];
  function onboard(S) {
    var i = Math.max(0, Math.min(OB.length - 1, S.ob)), st = OB[i], last = i === OB.length - 1, prog = "";

  /* overlays */
  function overlays(S) {
    var h = "";
    if (S.sheet) {
      var sh = S.sheet, who = sh.target === "jio" ? "Jio Prepaid" : "BigBasket", amt = sh.target === "jio" ? 299 : 1120;

          '<button class="m-btn primary" data-act="pin-done">Done</button></div></div>';

  function render(S) {

      case "trust": body = trust(S); break;
      case "amazon": body = amazon(S); break;
      case "mandate": body = mandate(S); break;
      case "revoked": body = revoked(S); break;

    trust: { screen: "trust" }, amazon: { screen: "amazon" }, "mandate-long": { screen: "mandate", long: true }, mandate: { screen: "mandate" },
    "revoke-dialog": { screen: "mandate", dialog: "revoke" }, revoked: { screen: "revoked" }

  }

  function set(name, w, cols, items, note) {

  function buttons() {

        items.push(["Type=" + t[0] + ", State=" + s[0], kit('<button class="m-btn ' + t[1] + s[1] + '"' + (s[0] === "Disabled" ? " disabled" : "") + ">" + (t[2] ? ic(t[2]) : "") + t[3] + "</button>", 300)]);
      });
    });
    return set("Button", 1060, 3, items, "Pill, 54px tall, one primary per screen. Pressed deepens the fill one step; disabled drops to 40% opacity and keeps its label.");
  }

    var topbar = set("Top bar", 860, 2, [["Duty=On", kit(top({ paused: false }), 350)], ["Duty=Paused", kit(top({ paused: true }), 350)]]);
    var ctr = set("Controls", 900, 4, [["Toggle=Off", kit('<span class="m-tg"></span>', 60)], ["Toggle=On", kit('<span class="m-tg on"></span>', 60)], ["Toggle=On, Tone=Hold", kit('<span class="m-tg hold on"></span>', 60)], ["Locked value", kit('<span class="m-lockv">' + ic("lock") + "₹15,000</span>", 140)],
      ["Stepper", kit('<span class="m-stepper"><button>' + ic("minus") + "</button><span>₹500</span><button>" + ic("plus") + "</button></span>", 160)], ["Segmented", kit('<div class="m-seg"><button>Instant</button><button class="on">10 min</button><button>1 hour</button></div>', 240)], ["Pill button=Default", kit('<button class="m-pillbtn">Cancel</button>', 100)], ["Pill button=Stop", kit('<button class="m-pillbtn stop">Revoke</button>', 100)]]);
    var meters = set("Ceiling meter", 1200, 3, [["Fill=21%, Surface=Brand", kit('<div class="m-hero" style="padding:18px"><div class="m-meter"><i style="--p:.21"></i></div></div>', 320)], ["Fill=64%, Surface=Brand", kit('<div class="m-hero" style="padding:18px"><div class="m-meter"><i style="--p:.64"></i></div></div>', 320)], ["Fill=100%, Surface=Brand", kit('<div class="m-hero" style="padding:18px"><div class="m-meter full"><i style="--p:1"></i></div></div>', 320)]], "At 100% the fill turns marigold and every payment becomes an ask until the 1st.");
    var voice = set("Agent voice", 860, 2, [["Size=L", kit(said("Your recharge expires tonight at 11:59. Shall I pay?"), 360)], ["Size=M", kit(said("Written in the khata.", "md"), 360)]], "The only place Instrument Serif appears in the product. If Munim didn't say it, it isn't italic.");
    var dials = set("Hold dial", 460, 2, [["Size=S, Time=08:23", kit(ring(503, true), 140)], ["Size=L, Time=01:10", kit(ring(70), 230)]]);
    var btn = buttons();
    var facts = set("Fact list", 440, 1, [["Rows=3", kit('<div class="m-card">' + fact("Paying from", BANK) + fact("Difference", "+₹280, 33%", "neg") + fact("Status", "Trusted", "pos") + "</div>", 360)]]);
    var pin = set("PIN sheet", 460, 1, [["State=Entering", kit('<div class="m" style="height:560px;background:transparent">' + overlays({ sheet: { target: "jio", digits: "12" } }).replace('class="m-veil"', 'class="m-veil" style="background:transparent;animation:none"') + "</div>", 390)]]);
    var dialog = set("Dialog", 460, 1, [["Type=Destructive", kit('<div class="m" style="height:420px;background:transparent">' + overlays({ dialog: "revoke" }).replace('class="m-veil center"', 'class="m-veil center" style="background:transparent;animation:none"') + "</div>", 390)]]);
    return [
      { name: "Actions", items: [btn, ctr], maxRow: 2200 },
      { name: "Status", items: [badges, avatars, dials, meters], maxRow: 2400 },
      { name: "Lists", items: [qrows, lrows, facts], maxRow: 2400 },
      { name: "Money moments", items: [holds, voice, pin, dialog], maxRow: 2400 },
      { name: "Navigation", items: [topbar, tabbar], maxRow: 2400 }
    ];
  }

  function screensPage() {
    return [
      { name: "01 · First run", items: [screenFrame("Intro 1", "intro-1", "Munim introduces himself with a real khata, not a feature list."), screenFrame("Intro 2", "intro-2", "The trust ladder, explained once."), screenFrame("Intro 3", "intro-3", "Safety: caps are NPCI's, the hold is the undo."), screenFrame("Intro 4", "intro-4", "Labelled speculative on the way in.")] },
      { name: "02 · Khata", items: [screenFrame("Home", "home", "One anchor number, one queue, one hold, then the ledger."), screenFrame("Home · paused", "home-paused", "Paused: the duty pill turns marigold and the hold freezes."), screenFrame("Home · full scroll", "home-long", "The whole khata, tab bar at the end of scroll.")] },
      { name: "03 · Approve a payment", items: [screenFrame("Ask · Jio", "ask", "Supervised merchant: reason, amount against usual, then the PIN."), screenFrame("PIN sheet", "pin", "The sheet keeps the ask visible behind it."), screenFrame("PIN · paid", "pin-done", "Paid, with a UPI reference and a line in Munim's voice."), screenFrame("Anomaly · BigBasket", "anomaly", "Failure state: a trusted merchant held because the price jumped 33%.")] },
      { name: "04 · Hold window", items: [screenFrame("Hold · counting", "hold", "Paid alone, but waits ten minutes in the open."), screenFrame("Hold · cancelled", "hold-cancelled", "Cancel mid-hold. Nothing moved."), screenFrame("Hold · paid", "hold-paid", "Timer ran out. Written in the khata.")] },
      { name: "05 · Trust and mandate", items: [screenFrame("Trust", "trust", "Per-merchant trust, with the ladder on top."), screenFrame("Amazon", "amazon", "Two of three approvals. Trust can be granted early, by you."), screenFrame("Mandate", "mandate-long", "The whole agreement on one page."), screenFrame("Revoke · confirm", "revoke-dialog", "Destructive confirm says exactly what gets cancelled."), screenFrame("Revoked", "revoked", "A munim leaves. The ledger remains.")], maxRow: 2600 }
    ];
  }

  /* ---------------- prototype controller ---------------- */
  var P = { S: initial(), root: null, timer: null, toastT: null, pinT: null };
  function paint() {
    var r = P.root; if (!r) return;
    var sc = r.querySelector(".m-scroll"), prevTop = sc ? sc.scrollTop : 0, prevScreen = r.dataset.screen;
    var fa = document.activeElement && r.contains(document.activeElement) ? document.activeElement : null;
    var fKey = fa ? (fa.dataset.act || "") + "|" + (fa.dataset.v || "") : null;
    r.innerHTML = render(P.S);
    r.dataset.screen = P.S.screen;
    var sc2 = r.querySelector(".m-scroll");
    if (sc2 && prevScreen === P.S.screen) sc2.scrollTop = prevTop;
    var overlay = r.querySelector('[role="dialog"], [role="alertdialog"]');
    var moved = false;
    if (overlay && !(fa && overlay.contains(fa))) { var f = overlay.querySelector("button:not([disabled])"); if (f) { f.focus({ preventScroll: true }); moved = true; } }
    if (fKey && !moved) {
      var parts = fKey.split("|");
      var again = Array.prototype.find.call(r.querySelectorAll("[data-act]"), function (b) { return b.dataset.act === parts[0] && (b.dataset.v || "") === parts[1]; });
      if (again) again.focus({ preventScroll: true });
    }
  }
  function go(screen) { P.S.screen = screen; P.S.toast = null; paint(); var sc = P.root.querySelector(".m-scroll"); if (sc) sc.scrollTop = 0; }
  function toast(msg, undo) {
    P.S.toast = { msg: msg, undo: undo || null }; paint();
    clearTimeout(P.toastT);
    P.toastT = setTimeout(function () { P.S.toast = null; paint(); }, 4200);
  }
  function tick() {
    var S = P.S;
    if (S.hold.status !== "counting" || S.paused || S.screen === "revoked") return;
    S.hold.secs = Math.max(0, S.hold.secs - 1);
    if (S.hold.secs === 0) {
      S.hold.status = "paid"; S.paid += 1179;
      S.extra.unshift({ d: 20, m: "ACT Fibernet", amt: 1179, note: "Auto after the 10 minute hold. Same plan as every month.", fresh: true });
      paint(); return;
    }
    Array.prototype.forEach.call(P.root.querySelectorAll(".hold-count"), function (e) { e.textContent = clock(S.hold.secs); });
    var d = P.root.querySelector(".hold-drain"); if (d) d.style.setProperty("--p", (S.hold.secs / 600).toFixed(3));
    var a = P.root.querySelector(".hold-arc");
    if (a) { var c = 2 * Math.PI * 52; a.setAttribute("stroke-dashoffset", (c * (1 - S.hold.secs / 600)).toFixed(1)); }
  }
  function pay(target) {
    var S = P.S;
    if (target === "jio") { S.jio = "paid"; S.paid += 299; S.extra.unshift({ d: 20, m: "Jio Prepaid", amt: 299, stamp: "Paid", stampKind: "trust", note: "Recharged before the 11:59 expiry. You approved.", fresh: true }); }
    else { S.bb = "paid"; S.paid += 1120; S.extra.unshift({ d: 20, m: "BigBasket", amt: 1120, stamp: "Paid", stampKind: "trust", note: "You paid the higher price after I flagged it.", fresh: true }); }
  }
  function act(a, v) {
    var S = P.S;
    switch (a) {
      case "tab": go(v); break;
      case "ask": case "anomaly": case "hold": case "amazon": go(a); break;
      case "back": go(S.screen === "amazon" ? "trust" : "home"); break;
      case "pin": S.sheet = { target: v, digits: "" }; paint(); break;
      case "pin-close": S.sheet = null; paint(); break;
      case "key":
        if (!S.sheet || S.sheet.done || S.sheet.digits.length >= 4) return;
        S.sheet.digits += v; paint();
        if (S.sheet.digits.length === 4) { clearTimeout(P.pinT); P.pinT = setTimeout(function () { pay(S.sheet.target); S.sheet.done = true; paint(); }, 420); }
        break;
      case "key-del": if (S.sheet && !S.sheet.done) { S.sheet.digits = S.sheet.digits.slice(0, -1); paint(); } break;
      case "pin-done": S.sheet = null; S.screen = "home"; paint(); P.root.querySelector(".m-scroll").scrollTop = 0; break;
      case "never-jio": S.jio = "never"; S.screen = "home"; toast("I won’t ask about Jio again.", "never-jio"); break;
      case "skip-bb": S.bb = "skipped"; S.extra.unshift({ d: 20, m: "BigBasket", amt: 1120, stamp: "Skipped", stampKind: "", note: "Skipped this week on your call. Nothing was paid.", out: true, fresh: true }); S.screen = "home"; toast("Skipped this week. Nothing was paid.", "skip-bb"); break;
      case "edit-bb": toast("Editing happens in BigBasket. I’ll re-check the new total."); break;
      case "cancel-hold": S.hold.status = "cancelled"; S.extra.unshift({ d: 20, m: "ACT Fibernet", amt: 1179, stamp: "Cancelled", note: "You cancelled it in the hold window. Nothing was paid.", out: true, fresh: true }); if (S.screen === "home") toast("Cancelled. Nothing was paid.", "cancel-hold"); else paint(); break;
      case "paynow-hold": S.hold.secs = 1; tick(); break;
      case "trust-amazon": S.amazonTrusted = true; S.screen = "trust"; toast("Amazon is trusted under ₹800."); break;
      case "untrust-amazon": S.amazonTrusted = false; S.screen = "trust"; toast("Amazon is supervised again."); break;
      case "duty": S.duties[v] = !S.duties[v]; paint(); break;
      case "pause": S.paused = !S.paused; paint(); break;
      case "cap": S.perPayCap = Math.max(100, Math.min(5000, S.perPayCap + (+v))); paint(); break;
      case "hold-choice": S.holdChoice = v; paint(); break;
      case "revoke": S.dialog = "revoke"; paint(); break;
      case "dialog-close": S.dialog = null; paint(); var rb = P.root.querySelector('[data-act="revoke"]'); if (rb) rb.focus(); break;
      case "revoke-yes": S.dialog = null; if (S.hold.status === "counting") S.hold.status = "cancelled"; go("revoked"); break;
      case "restart": restart(); break;
      case "ob-next": if (S.ob >= OB.length - 1) go("home"); else { S.ob++; paint(); } break;
      case "ob-prev": S.ob = Math.max(0, S.ob - 1); paint(); break;
      case "ob-skip": go("home"); break;
      case "toast-undo":
        var u = S.toast && S.toast.undo; S.toast = null;
        if (u === "never-jio") S.jio = "waiting";
        if (u === "skip-bb") { S.bb = "held"; S.extra.shift(); }
        if (u === "cancel-hold") { S.hold.status = "counting"; S.extra.shift(); }
        paint(); break;
    }
  }
  function restart() { clearTimeout(P.toastT); P.S = preset("intro-1"); paint(); }
  var proto = {
    note: "Every button works. Approve Jio with any 4-digit PIN, open the BigBasket anomaly, cancel the ACT hold (it pays itself when the timer ends), grant Amazon trust early, pause Munim, or revoke the mandate.",
    flows: [
      { name: "First run", desc: "Four-step introduction, then the khata.", go: function () { proto.go("intro-1"); } },
      { name: "Approve a supervised payment", desc: "Jio asks, you enter a UPI PIN.", go: function () { proto.go("ask"); } },
      { name: "Anomaly on a trusted merchant", desc: "BigBasket's price jumped; Munim held it.", go: function () { proto.go("anomaly"); } },
      { name: "Cancel inside the hold", desc: "ACT Fibernet, ten-minute window.", go: function () { proto.go("hold"); } },
      { name: "Grant trust early", desc: "Amazon, two of three approvals.", go: function () { proto.go("amazon"); } },
      { name: "Revoke the mandate", desc: "Kill switch with a clear confirm.", go: function () { proto.go("mandate"); } }
    ],
    mount: function (el) {
      P.root = el; restart();
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act]");
        if (b && !b.disabled && el.contains(b)) act(b.dataset.act, b.dataset.v);
      });
      el.addEventListener("keydown", function (e) {
        var S = P.S;
        if (e.key === "Escape") { if (S.sheet) { S.sheet = null; paint(); } else if (S.dialog) act("dialog-close"); return; }
        if (S.sheet && !S.sheet.done) {
          if (/^[0-9]$/.test(e.key)) { e.preventDefault(); act("key", e.key); }
          else if (e.key === "Backspace") { e.preventDefault(); act("key-del"); }
        }
        if (e.key === "Tab") {
          var ov = el.querySelector('[role="dialog"], [role="alertdialog"]');
          if (!ov) return;
          var f = ov.querySelectorAll("button:not([disabled])"); if (!f.length) return;
          if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
        }
      });
      clearInterval(P.timer); P.timer = setInterval(tick, 1000);
    },
    go: function (key) { clearTimeout(P.toastT); P.S = preset((key || "home").replace("-long", "")); P.S.long = false; paint(); },
    restart: restart
  };

  FG.boot({
    brand: lockup(), tagline: "Delegate UPI payments to an AI agent without losing control. Trust is earned per merchant, and anything it pays alone waits in the open first.",
    fonts: ['400 16px "Anek Latin"', '600 16px "Anek Latin"', '650 16px "Anek Latin"', 'italic 400 16px "Instrument Serif"', '500 16px "Anek Devanagari"'],
    file: "Munim — Design System", version: "v4.0",
    vars: ["--m-bg", "--m-surface", "--m-sunken", "--m-line", "--m-ink", "--m-ink-2", "--m-ink-3", "--m-brand", "--m-trust", "--m-trust-soft", "--m-hold", "--m-hold-soft", "--m-hold-ink", "--m-stop", "--m-stop-soft"],
    textStyles: [["Display / Amount", "56 · 600"], ["Title / L", "32 · 650"], ["Title / M", "23 · 650"], ["Heading", "17 · 650"], ["Body / L", "16 · 400"], ["Body / M", "14.5 · 400"], ["Label", "12.5 · 600"], ["Overline", "12 · 600"], ["Voice / L", "Serif It. 27"], ["Voice / M", "Serif It. 22"], ["Voice / S", "Serif It. 16"]],
    pages: pages(),
    proto: proto
  });
})();
